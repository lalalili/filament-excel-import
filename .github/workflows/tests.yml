name: Tests

on:
  push:
    branches:
      - 4.x
  pull_request:
    branches:
      - 4.x

jobs:
  tests:
    name: PHP 8.4 / Laravel 13 / Filament 5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress --with="filament/filament:^5.0" --with="illuminate/contracts:^13.0" --with="laravel/framework:^13.0" --with="orchestra/testbench:^11.0"

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer analyse

      - name: Check formatting
        run: composer format -- --test
